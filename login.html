<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios | Las Gaviotas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="menu-principal">
        <a href="">
            <img src="img/logo.svg" alt="Las Gaviotas" class="logo">
        </a>

        <label for="mobile-toggle" class="mobile-toggle-label">
            <img src="img/icono-menu.svg" alt="">
        </label>
        <input type="checkbox" id="mobile-toggle" class="toggle">

        </input>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="servicios.html" class="activo">Servicios</a>
            <a href="opiniones.html">Opiniones</a>
            <a href="contacto.html">Contacto</a>
        </nav>

        <a href="reservas.html" class="boton">Reservar</a>
    </header>
    <main>

        <section class="login contenedor">

            <h1>Panel administrador</h1>

            <form id="formLogin">

                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" required>

                <button class="boton" type="submit">
                    Ingresar
                </button>

                <p id="mensajeLogin"></p>

            </form>

        </section>

    </main>
    <script src="src/core/administrador.js"></script>
    <script src="src/app.js"></script>
</body>

</html>
